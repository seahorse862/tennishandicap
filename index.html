<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173620">
<title>MLTC Handicap</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <img src="icons/mltc-logo-header.png" alt="Maidenhead Lawn Tennis Club" class="club-logo">
  <span class="eyebrow">Maidenhead LTC</span>
  <h1>Handicap Calculator</h1>
</header>

<main>
  <section class="card">
    <p class="status">Pick both players' handicaps and tap Calculate to see game-by-game scores and the tie-break start.</p>

    <div class="player-row">
      <label for="p1">Player 1 handicap</label>
      <select id="p1"></select>
    </div>

    <div class="player-row">
      <label for="p2">Player 2 handicap</label>
      <select id="p2"></select>
    </div>

    <button id="calc-btn" class="primary-btn">Calculate</button>

    <div id="result" class="result" hidden></div>
    <div id="tiebreak-result" class="tiebreak" hidden></div>
  </section>

  <p class="install-hint" id="install-hint" hidden>
    📲 Tap <strong>Share → Add to Home Screen</strong> (iPhone) or use the install icon in your address bar (Android/Chrome) to install this as an app.
  </p>

  <footer class="app-footer">
    <a href="https://clubspark.lta.org.uk/MaidenheadLawnTennisClub/Competition/DASHT26HandicapEvents" target="_blank" rel="noopener">
      Full handicap rules &amp; events →
    </a>
  </footer>
</main>

<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
